services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gully11
      POSTGRES_PASSWORD: gully11
      POSTGRES_DB: gully11
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gully11"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
