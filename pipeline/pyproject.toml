[project]
name = "gully-pipeline"
version = "0.1.0"
description = "Cricsheet ingestion and aggregation for Gully11"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=17",
    "duckdb>=1.1",
    "httpx>=0.27",
]

[project.scripts]
gully-pipeline = "gully_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gully_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
